# Grafana data source provisioning: the Prometheus of docker-compose.yml.
# The dashboard's "Data source" variable picks the default Prometheus data source, so this one is the default.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
