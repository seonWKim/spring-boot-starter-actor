# Prometheus configuration for docker-compose.yml.
# The scrape target comes from ACTOR_TARGET (default host.docker.internal:8080): the compose file's
# "setup" service writes it to targets/actor.json. The alert rules are actor-alerts.yaml's spec.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/generated/rules/*.yml

scrape_configs:
  - job_name: actor
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files:
          - /etc/prometheus/generated/targets/*.json
