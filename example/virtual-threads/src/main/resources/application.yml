spring:
  application:
    name: virtual-threads-example
  actor:
    name: virtual-threads-example
    provider: local
    pekko:
      actor:
        allow-java-serialization: off
        warn-about-java-serializer-usage: on
    # withBlockingDispatcher() runs on virtual threads
    virtual-threads:
      enabled: true
    # A named dispatcher on virtual threads: withDispatcherFromConfig("virtual-threads-dispatcher")
    dispatchers:
      virtual-threads-dispatcher:
        virtual: true

server:
  port: 8080

logging:
  level:
    org.apache.pekko: INFO
    io.github.seonwkim: DEBUG
