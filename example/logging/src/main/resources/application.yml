server:
  port: 8080

spring:
  application:
    name: logging-example

  # Actor system configuration. The actors that block (Thread.sleep stands in for I/O) are spawned
  # with withBlockingDispatcher(), Pekko's dispatcher for blocking work.
  actor:
    name: LoggingExampleSystem

logging:
  level:
    root: INFO
    io.github.seonwkim.example.logging: DEBUG
    org.apache.pekko: INFO
    org.apache.pekko.actor: INFO

  # Log patterns are configured in logback.xml
  # See logback.xml for production-ready logging configuration with:
  # - Async appenders
  # - JSON structured logging
  # - MDC context
  # - Rolling file policies
