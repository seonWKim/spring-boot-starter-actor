apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spring-actor
  namespace: spring-actor
spec:
  podSelector:
    matchLabels:
      app: spring-actor
  policyTypes:
  - Ingress
  - Egress

  ingress:
  # Allow inter-pod communication for clustering
  - from:
    - podSelector:
        matchLabels:
          app: spring-actor
    ports:
    - protocol: TCP
      port: 25520  # Pekko remoting
    - protocol: TCP
      port: 7626   # Pekko management (Cluster Bootstrap)

  # Allow HTTP traffic from anywhere (or restrict to ingress controller)
  - from: []
    ports:
    - protocol: TCP
      port: 8080  # HTTP

  # Actuator (management.server.port) only for Prometheus. The kubelet's probes come from the node,
  # which most network plugins let through; if yours doesn't, add an ipBlock for the node addresses.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8081  # Actuator: health, metrics, prometheus

  egress:
  # Allow inter-pod communication
  - to:
    - podSelector:
        matchLabels:
          app: spring-actor
    ports:
    - protocol: TCP
      port: 25520
    - protocol: TCP
      port: 7626

  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53

  # Allow Kubernetes API access
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          component: apiserver
    ports:
    - protocol: TCP
      port: 443

  # Allow egress to external services (databases, APIs, etc.)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
