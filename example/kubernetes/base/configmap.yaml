apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-actor-config
  labels:
    app: spring-actor
data:
  application.yaml: |
    spring:
      application:
        name: spring-actor-app
      actor:
        name: spring-actor-system
        provider: cluster
        remote:
          hostname: ${POD_IP}
          port: 25520
        # Leaving the cluster; fits in the Deployment's 45s grace period (see deployment.yaml).
        shutdown:
          timeout: 25s
        pekko:
          actor:
            allow-java-serialization: off
            warn-about-java-serializer-usage: on

          remote:
            artery:
              bind:
                hostname: 0.0.0.0
                port: 25520

          cluster:
            downing-provider-class: org.apache.pekko.cluster.sbr.SplitBrainResolverProvider
            split-brain-resolver:
              active-strategy: keep-majority
              stable-after: 20s
              down-all-when-unstable: 15s

            shutdown-after-unsuccessful-join-seed-nodes: 60s

          coordinated-shutdown:
            phases:
              cluster-leave:
                timeout: 10s
              cluster-sharding-shutdown-region:
                timeout: 10s
              actor-system-terminate:
                timeout: 10s

          management:
            http:
              hostname: ${POD_IP}
              port: 7626
              bind-hostname: 0.0.0.0
              bind-port: 7626
            cluster:
              bootstrap:
                contact-point-discovery:
                  discovery-method: kubernetes-api
                  service-name: spring-actor
                  required-contact-point-nr: 2
                  stable-margin: 5s
                  interval: 1s
                  exponential-backoff-random-factor: 0.1
                  exponential-backoff-max: 15s
                  contact-with-all-contact-points: true

          discovery:
            method: kubernetes-api
            kubernetes-api:
              pod-namespace: ${NAMESPACE}
              pod-label-selector: app=spring-actor
              pod-port-name: management

    server:
      port: 8080
      shutdown: graceful

    management:
      # Actuator (health, metrics, info, prometheus) on its own port: the NetworkPolicy opens 8080 to
      # every client but 8081 only to the monitoring namespace (and the kubelet's probes).
      server:
        port: 8081
      endpoints:
        web:
          exposure:
            include: health,prometheus,info,metrics
      endpoint:
        health:
          probes:
            enabled: true
          show-details: always
          group:
            readiness:
              # Ready only while this pod is an Up cluster member.
              include: readinessState,actorCluster
      health:
        actor:
          warmup:
            # /actuator/health/warmup is UP once this pod is an Up member of a cluster with at
            # least 2 Up members. blue-green.sh deploy waits for it before activation.
            min-members: 2
        readinessState:
          enabled: true
        livenessState:
          enabled: true
      metrics:
        export:
          prometheus:
            enabled: true
        tags:
          application: spring-actor-app
          environment: ${ENVIRONMENT:production}

    logging:
      level:
        root: INFO
        org.apache.pekko: INFO
        org.apache.pekko.cluster: INFO
        org.apache.pekko.management: DEBUG
        io.github.seonwkim: DEBUG
      pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
