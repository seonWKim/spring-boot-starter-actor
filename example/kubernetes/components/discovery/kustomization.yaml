# Cluster formation through a peer registry (spring.actor.cluster.join=discovery):
# no Kubernetes API access, so no Role or RoleBinding. The overlays discovery-jdbc and
# discovery-redis add the store.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
- networkpolicy.yaml

patches:
# The pods never call the Kubernetes API: drop the pod-reader Role and its binding.
- target:
    kind: Role
    name: spring-actor-pod-reader
  patch: |-
    $patch: delete
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: spring-actor-pod-reader
- target:
    kind: RoleBinding
    name: spring-actor-pod-reader-binding
  patch: |-
    $patch: delete
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: spring-actor-pod-reader-binding
- path: deployment-patch.yaml
- path: configmap-patch.yaml
