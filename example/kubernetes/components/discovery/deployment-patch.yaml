apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-actor
spec:
  template:
    spec:
      # No API token in the pods: discovery goes through the store.
      automountServiceAccountToken: false
      containers:
      - name: spring-actor
        # Probes on Spring Boot's management health (Actuator, on its own port): the readiness group includes
        # actorCluster, so a pod gets traffic only while it is an Up cluster member.
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: actuator
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: actuator
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: actuator
