# App -> Redis. Change the selector (or use an ipBlock) to match your Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spring-actor-store
spec:
  podSelector:
    matchLabels:
      app: spring-actor
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
    ports:
    - protocol: TCP
      port: 6379
