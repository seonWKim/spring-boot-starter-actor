spring:
  application:
    name: agent-example
  actor:
    name: agent-example
    provider: cluster
    remote:
      hostname: 127.0.0.1
      port: 2551
    cluster:
      # A one-node cluster. For more nodes, remove join-self and list seed-nodes instead.
      join-self: true
    pekko:
      actor:
        allow-java-serialization: off
        warn-about-java-serializer-usage: on
      cluster:
        name: agent-example
        downing-provider-class: org.apache.pekko.cluster.sbr.SplitBrainResolverProvider

agent:
  calls-per-second: 20
  approval-timeout: 30s
  max-tool-steps: 5
  fake-llm-latency: 200ms
  demo: true
