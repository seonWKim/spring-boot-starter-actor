# Each module keeps its own freeze store, relative to the module directory (the test working dir).
freeze.store.default.path=src/test/archunit-store
# Never create a store silently (for example in CI): a module with frozen violations checks its
# store in. Create or refreeze locally with -Darchunit.freeze.store.default.allowStoreCreation=true.
freeze.store.default.allowStoreCreation=false
# Fixed violations leave the store when the rule runs, so the store only shrinks.
freeze.store.default.allowStoreUpdate=true
