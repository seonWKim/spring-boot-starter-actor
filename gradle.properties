version=0.10.0
group=io.github.seonwkim

# Modules: artifactId = module name (ARCHITECTURE.md decision 2)
artifactId.actor-api=actor-api
pomName.actor-api=Actor API
pomDescription.actor-api=The public API of the Spring Boot actor starter: types users code against, with no Pekko dependency.

artifactId.actor-core=actor-core
pomName.actor-core=Actor Core
pomDescription.actor-core=Local actor engine for Spring Boot, implemented with Apache Pekko.

artifactId.actor-autoconfigure=actor-autoconfigure
pomName.actor-autoconfigure=Actor Auto-configuration
pomDescription.actor-autoconfigure=Spring Boot auto-configuration for the actor modules.

artifactId.actor-cluster=actor-cluster
pomName.actor-cluster=Actor Cluster
pomDescription.actor-cluster=Cluster, sharding, singleton, cluster events and management for the actor modules, implemented with Apache Pekko.

artifactId.actor-spring-boot-starter=actor-spring-boot-starter
pomName.actor-spring-boot-starter=Actor Spring Boot Starter
pomDescription.actor-spring-boot-starter=Spring Boot starter for the actor model on Apache Pekko.

artifactId.actor-spring-boot-starter-cluster=actor-spring-boot-starter-cluster
pomName.actor-spring-boot-starter-cluster=Actor Spring Boot Starter (cluster)
pomDescription.actor-spring-boot-starter-cluster=Spring Boot starter for clustered actors: the local starter plus cluster, sharding and singleton.

artifactId.actor-metrics=actor-metrics
pomName.actor-metrics=Actor Metrics
pomDescription.actor-metrics=ByteBuddy-based instrumentation and Micrometer integration for the actor modules.

artifactId.actor-jdbc=actor-jdbc
pomName.actor-jdbc=Actor JDBC
pomDescription.actor-jdbc=Peer discovery for the actor modules on the application's DataSource.

artifactId.actor-redis=actor-redis
pomName.actor-redis=Actor Redis
pomDescription.actor-redis=Peer discovery for the actor modules on the application's RedisConnectionFactory.

artifactId.actor-test=actor-test
pomName.actor-test=Actor Test
pomDescription.actor-test=Test support for the actor modules: the @ActorTest slice, multi-node cluster helpers and the SPI contract test suites.

# Relocation POMs for the 0.x coordinates (one release)
pomName.spring-boot-starter-actor=Spring Boot Starter Actor (relocated)
pomDescription.spring-boot-starter-actor=Relocated to io.github.seonwkim:actor-spring-boot-starter.
pomName.spring-boot-starter-actor_3=Spring Boot Starter Actor for Boot 3 (relocated)
pomDescription.spring-boot-starter-actor_3=Relocated to io.github.seonwkim:actor-spring-boot-starter.
pomName.spring-boot-starter-actor-metrics=Spring Boot Starter Actor Metrics (relocated)
pomDescription.spring-boot-starter-actor-metrics=Relocated to io.github.seonwkim:actor-metrics.

