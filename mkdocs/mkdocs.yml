site_name: actor-spring-boot-starter
site_url: https://seonwkim.github.io/actor-spring-boot-starter
repo_url: https://github.com/seonWKim/actor-spring-boot-starter
repo_name: GitHub
edit_uri: edit/main/mkdocs/docs/
theme:
  name: material
  palette:
    primary: green
    accent: green
  logo: logo.png
  favicon: logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # "." when mkdocs runs from the repository root (CI), ".." when it runs from mkdocs/
      base_path: [".", ".."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables

# Writes llms-full.txt (Getting Started and every guide in one file) to the site root.
hooks:
  - hooks/llms_full.py

nav:
  - Home:
    - index.md
    - getting-started.md
    - migrating-from-0x.md
  - Guides:
    - Actor Registration and Messaging: guides/actor-registration-messaging.md
    - Pub/Sub Topics: guides/pub-sub-topics.md
    - Routers: guides/routers.md
    - Receptionist: guides/receptionist.md
    - Dispatchers: guides/dispatchers.md
    - Logging with MDC and Tags: guides/logging.md
    - Sharded Actors: guides/sharded-actors.md
    - Cluster Formation: guides/cluster-formation.md
    - Persistence with Spring Boot: guides/persistence-spring-boot.md
    - Running in Production: guides/production.md
    - AI Agents: guides/ai-agents.md
    - Configuration Reference: guides/configuration.md
  - Examples:
    - Overview: examples/index.md
    - Simple: examples/simple.md
    - Cluster: examples/cluster.md
    - Synchronization: examples/synchronization.md
    - Chat: examples/chat.md
    - Monitoring: examples/monitoring.md
  - Contributing:
    - Spring Conventions: contributing/spring-conventions.md
    - RFCs: contributing/rfcs/index.md

extra_css:
  - stylesheets/extra.css
