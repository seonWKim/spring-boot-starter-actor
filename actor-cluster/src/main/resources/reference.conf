# Discovery on the application's PeerRegistry bean (spring.actor.cluster.join=discovery).
# The starter sets heartbeat-interval and ttl from spring.actor.cluster.discovery.*.
pekko.discovery.spring-actor-peer-registry {
  class = "io.github.seonwkim.actor.internal.cluster.discovery.PeerRegistryServiceDiscovery"
}

# Leases on the application's LeaseStore bean (spring.actor.cluster.lease.*), for
# lease-majority, singleton.use-lease and sharding.use-lease. The starter sets heartbeat-timeout
# (the ttl), heartbeat-interval and expiry-margin from spring.actor.cluster.lease.*.
spring-actor.lease {
  lease-class = "io.github.seonwkim.actor.internal.cluster.lease.LeaseStoreLease"
}
