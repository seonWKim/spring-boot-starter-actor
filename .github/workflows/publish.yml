name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Enter a tag to publish (e.g., v0.0.5)'
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}

      - name: 🔍 Validate tag exists
        id: set-tag
        run: |
          echo "🔎 Verifying that tag '${{ github.event.inputs.tag }}' exists..."
          git fetch --tags
          if git rev-parse "${{ github.event.inputs.tag }}" >/dev/null 2>&1; then
            echo "✅ Tag found."
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Tag '${{ github.event.inputs.tag }}' does not exist."
            exit 1
          fi

  publish:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      # Publishes every library module (artifactId.<module> in gradle.properties: actor-api,
      # actor-core, actor-autoconfigure, actor-spring-boot-starter, actor-metrics) and the
      # relocation POMs under relocation/ as one Maven Central deployment.
      - name: 🚀 Publish to Maven Central (all modules)
        run: |
          ./gradlew build
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
