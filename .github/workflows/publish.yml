name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Enter a tag to publish (e.g., v0.0.5)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The input reaches the shell only through the environment, and only once it looks like v1.2.3;
      # the publish job checks out this job's output, not the raw input.
      - name: 🔍 Validate tag
        id: set-tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          bash scripts/release/check-tag.sh "$TAG"
          echo "🔎 Verifying that tag '$TAG' exists..."
          git fetch --tags
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "✅ Tag found."
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Tag '$TAG' does not exist."
            exit 1
          fi

  publish:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      # Publishes every library module (artifactId.<module> in gradle.properties), the actor-bom
      # BOM and the relocation POMs under relocation/ as one Maven Central deployment.
      - name: 🚀 Publish to Maven Central (all modules)
        run: |
          ./gradlew build
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
