name: Pull Request Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      # Gradle runs on JDK 21 (the compile toolchain, --release 21); the tests run on the matrix JDK.
      - name: ☕ Set up JDK ${{ matrix.java }} and 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            ${{ matrix.java }}
            21
          cache: gradle

      - name: 🧪 Build (all modules, tests, spotless)
        run: >
          ./gradlew build
          -PtestJavaVersion=${{ matrix.java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64

      # The console shows only a failed test's exception; the reports and the XML results also hold
      # each test's log output (e.g. the cluster log of a flaky cluster test).
      - name: 📤 Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

      # Maven Central rejects a deployment when a POM dependency has no version.
      - name: 📦 Check published POMs
        run: |
          ./gradlew generatePomFileForMavenPublication --no-configuration-cache
          python3 scripts/release/check-poms.py

  docs:
    name: Docs (llms.txt links, llms-full.txt, mkdocs build)
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install mkdocs-material mkdocs-redirects

      - name: 🧪 Docs tooling tests
        run: scripts/docs/test.sh
