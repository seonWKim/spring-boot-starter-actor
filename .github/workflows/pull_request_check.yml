name: Pull Request Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      # Gradle runs on JDK 21 (the compile toolchain, --release 21); the tests run on the matrix JDK.
      - name: ☕ Set up JDK ${{ matrix.java }} and 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            ${{ matrix.java }}
            21
          cache: gradle

      - name: 🧪 Build (all modules, tests, spotless)
        run: >
          ./gradlew build
          -PtestJavaVersion=${{ matrix.java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64
