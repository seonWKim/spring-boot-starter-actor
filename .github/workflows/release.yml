name: Create tag and Publish

on:
  workflow_dispatch:
    inputs:
      bumpType:
        description: 'Select version bump type'
        required: true
        default: 'hotfix'
        type: choice
        options:
          - hotfix
          - minor
          - major

jobs:
  bump-version:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to push, merge, delete, tag

    outputs:
      version: ${{ steps.bump.outputs.new_version }}

    steps:
      - name: 📥 Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🧪 Extract current version from gradle.properties
        id: get_version
        run: |
          echo "🔍 Reading version from gradle.properties..."
          version=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: 🔢 Calculate new version
        id: bump
        run: |
          current=${{ steps.get_version.outputs.version }}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$current"

          case "${{ github.event.inputs.bumpType }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            hotfix)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "🆕 New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: 🌱 Create release branch
        run: |
          git checkout -b release/${{ steps.bump.outputs.new_version }}

      - name: 📝 Update version in gradle.properties
        run: |
          echo "✏️ Updating gradle.properties..."
          sed -i.bak -E "s/^version=[0-9]+\.[0-9]+\.[0-9]+/version=${{ steps.bump.outputs.new_version }}/" gradle.properties
          rm gradle.properties.bak
          git diff gradle.properties

      - name: ✅ Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "⚠️ No changes to commit."
            exit 0
          fi

          git add gradle.properties
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"

      - name: 🚀 Push release branch
        run: |
          git push origin release/${{ steps.bump.outputs.new_version }}

      - name: 🔀 Merge into main
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}
          git checkout main
          git pull origin main
          git merge --no-ff release/${{ steps.bump.outputs.new_version }} -m "Merge release/${{ steps.bump.outputs.new_version }} into main"
          git push origin main

      - name: 🔖 Create Git tag v<version>
        run: |
          TAG_NAME="v${{ steps.bump.outputs.new_version }}"
          echo "🏷 Creating tag $TAG_NAME"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: 🧹 Delete release branch
        run: |
          git push origin --delete release/${{ steps.bump.outputs.new_version }}

  prepare:
    runs-on: ubuntu-latest
    needs: bump-version
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: 📦 Checkout repository at tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v${{ needs.bump-version.outputs.version }}

      - name: 🔍 Validate tag exists
        id: set-tag
        run: |
          TAG_NAME="v${{ needs.bump-version.outputs.version }}"
          echo "🔎 Verifying that tag '$TAG_NAME' exists..."
          git fetch --tags
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "✅ Tag found."
            echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Tag '$TAG_NAME' does not exist."
            exit 1
          fi

  publish:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      # Publishes every library module (artifactId.<module> in gradle.properties: actor-api,
      # actor-core, actor-autoconfigure, actor-spring-boot-starter, actor-metrics) and the
      # relocation POMs under relocation/ as one Maven Central deployment.
      - name: 🚀 Publish to Maven Central (all modules)
        run: |
          ./gradlew build
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  create-github-release:
    runs-on: ubuntu-latest
    needs: [bump-version, prepare, publish]
    if: |
      always() &&
      needs.bump-version.result == 'success' &&
      needs.prepare.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: 📦 Build metrics agent JAR
        run: |
          echo "🔨 Building metrics agent JAR..."
          ./gradlew :actor-metrics:agentJar

          # Find the agent JAR
          AGENT_JAR=$(find actor-metrics/build/libs -name "*-agent.jar" | head -n 1)
          echo "✅ Agent JAR built: $AGENT_JAR"
          echo "AGENT_JAR_PATH=$AGENT_JAR" >> $GITHUB_ENV

      - name: 📝 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.tag }}
          body: |
            ## Spring Boot Starter Actor ${{ needs.prepare.outputs.tag }}

            Publish: ${{ needs.publish.result }}

            ### Maven Dependency

            Requires Java 21+ and Spring Boot 3.5+.

            ```gradle
            dependencies {
                implementation 'io.github.seonwkim:actor-spring-boot-starter:${{ needs.bump-version.outputs.version }}'
                // Metrics (optional)
                implementation 'io.github.seonwkim:actor-metrics:${{ needs.bump-version.outputs.version }}'
            }
            ```

            ### Metrics Agent

            Download the `actor-metrics-${{ needs.bump-version.outputs.version }}-agent.jar` file below and run your application with:

            ```bash
            java -javaagent:actor-metrics-${{ needs.bump-version.outputs.version }}-agent.jar -jar your-app.jar
            ```

            See [Metrics Documentation](https://github.com/seonWKim/actor-spring-boot-starter/blob/main/actor-metrics/README.md) for detailed setup instructions.
          files: |
            ${{ env.AGENT_JAR_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
